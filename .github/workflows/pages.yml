name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/cool-wozniak-wlei8y]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp -r index.html css js _site/
          # 캐시 무효화: CSS·JS 주소에 커밋 해시를 붙인다. 브라우저에 남은 이전 버전 파일이
          # 새 HTML과 섞여 화면이 깨지는 일을 막는다.
          sed -i -E "s#(href|src)=\"((css|js)/[^\"]+\.(css|js))\"#\1=\"\2?v=${GITHUB_SHA::8}\"#g" _site/index.html
          grep -c "?v=${GITHUB_SHA::8}" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
