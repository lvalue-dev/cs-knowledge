<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS 보이는 코드 — 한 줄씩 눈으로 배우는 CS</title>
<meta name="description" content="코드 한 줄이 메모리와 성능을 어떻게 바꾸는지 애니메이션으로 보여주는 CS 학습 사이트">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <a class="brand" href="#">
      <span class="logo">▮▯▮</span>
      <span><b>CS 보이는 코드</b><small>한 줄씩, 눈으로 배우는 CS</small></span>
    </a>
    <p class="intro">코드만 봐서는 감이 안 오는 개념을, 줄 단위 실행 애니메이션과 성능 수치로 보여 줍니다.</p>
    <a id="symlink" href="#symptoms"><b>증상으로 찾기</b><small>디버깅 중 본 현상 → 원인 개념과 처방</small></a>
    <nav id="nav"></nav>
    <button id="theme" type="button">테마 전환</button>
  </aside>
  <div id="scrim"></div>
  <main id="main">
    <header class="top">
      <button id="menu" type="button" aria-label="목차 열기">☰</button>
      <div class="top-text">
        <div class="crumbs"><span id="level" class="badge"></span><span id="pos"></span></div>
        <h1 id="title"></h1>
        <p id="summary"></p>
      </div>
      <label id="param" hidden><span></span><select></select></label>
    </header>
    <section id="symview" hidden></section>
    <section id="verdict" hidden></section>
    <section id="cards" class="cards"></section>
    <section id="learn"></section>
    <nav id="pager"></nav>
  </main>
  <footer id="player">
    <div class="pl-btns">
      <button id="b-reset" type="button" title="처음으로 (Home)">⏮</button>
      <button id="b-prev" type="button" title="이전 단계 (←)">◀</button>
      <button id="b-play" type="button" class="primary" title="재생/정지 (Space)">▶ 재생</button>
      <button id="b-next" type="button" title="다음 단계 (→)">▶</button>
    </div>
    <input id="scrub" type="range" min="0" max="0" value="0" aria-label="실행 단계">
    <span id="count">0 / 0</span>
    <label class="speed">속도
      <select id="speed">
        <option value="0.5">0.5×</option><option value="1" selected>1×</option>
        <option value="2">2×</option><option value="4">4×</option><option value="8">8×</option>
      </select>
    </label>
  </footer>
</div>
<script src="js/engine.js"></script>
<script src="js/lessons/basic.js"></script>
<script src="js/lessons/basic2.js"></script>
<script src="js/lessons/mid.js"></script>
<script src="js/lessons/mid2.js"></script>
<script src="js/lessons/advanced.js"></script>
<script src="js/lessons/advanced2.js"></script>
<script src="js/lessons/senior.js"></script>
<script src="js/lessons/senior2.js"></script>
<script src="js/symptoms.js"></script>
<script src="js/app.js"></script>
</body>
</html>
