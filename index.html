<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS 보이는 코드 — 한 줄씩 눈으로 배우는 CS</title>
<meta name="description" content="코드 한 줄이 메모리와 성능을 어떻게 바꾸는지 애니메이션으로 보여주는 CS 학습 사이트">
<meta name="theme-color" content="#090b10">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <a class="brand" href="#">
      <span class="logo"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="10" width="4" height="8" rx="1.5"/><rect x="8" y="2" width="4" height="16" rx="1.5"/><rect x="14" y="6" width="4" height="12" rx="1.5" opacity=".65"/></svg></span>
      <span><b>CS 보이는 코드</b><small>한 줄씩, 눈으로 배우는 CS</small></span>
    </a>
    <p class="intro">코드만 봐서는 감이 안 오는 개념을, 줄 단위 실행 애니메이션과 성능 수치로 보여 줍니다.</p>
    <div id="prog"><div><span>학습 진도</span><b></b></div><div class="lvbar"><i></i></div></div>
    <a id="symlink" class="hub" href="#symptoms"><span class="hub-ic"><i data-ic="pulse"></i></span><span><b>증상으로 찾기</b><small>디버깅 중 본 현상 → 원인과 처방</small></span></a>
    <a id="preplink" class="hub" href="#prep"><span class="hub-ic"><i data-ic="cap"></i></span><span><b>면접 · 코테 대비</b><small>질문 은행 · 문제 유형 고르기</small></span></a>
    <a id="drilllink" class="hub" href="#drill"><span class="hub-ic"><i data-ic="target"></i></span><span><b>코테 실전 훈련</b><small>유형 맞히기 · 사고방식과 팁</small></span></a>
    <div class="nav-h"><span>분야별 레슨</span><button id="expand" type="button">모두 펼치기</button></div>
    <div id="lvfilter" class="chips" role="group" aria-label="난이도 필터">
      <button type="button" class="chip" data-l="">전체</button>
      <button type="button" class="chip" data-l="basic"><i class="lv basic"></i>기초</button>
      <button type="button" class="chip" data-l="mid"><i class="lv mid"></i>중급</button>
      <button type="button" class="chip" data-l="adv"><i class="lv adv"></i>심화</button>
      <button type="button" class="chip" data-l="senior"><i class="lv senior"></i>시니어</button>
    </div>
    <nav id="nav"></nav>
    <button id="theme" type="button"><i data-ic="theme"></i>밝게 / 어둡게</button>
  </aside>
  <div id="scrim"></div>
  <main id="main">
    <header id="bar">
      <button id="menu" type="button" aria-label="목차 열기/접기" title="목차 열기/접기"><i data-ic="menu"></i></button>
      <div class="headline"><h1 id="title"></h1><span id="level" class="badge"></span><span id="pos"></span></div>
      <div class="top-ctl">
        <button id="tip" type="button" hidden>그림이 작다면 목차 접기</button>
        <div id="viewmode" class="seg" role="group" aria-label="보기 방식" hidden>
          <button type="button" data-m="side" title="두 방식을 한 화면에 나란히">나란히</button>
          <button type="button" data-m="focus" title="한 방식씩 크게">하나씩</button>
        </div>
        <label id="param" hidden><span></span><select></select></label>
        <a id="tolearn" href="#learn" title="정리 · 증상으로 이동"><span>정리 · 증상</span><i data-ic="down"></i></a>
      </div>
    </header>
    <div id="stage">
      <p id="summary"></p>
      <section id="symview" hidden></section>
      <section id="score" aria-label="지표 비교"></section>
      <nav id="tabs" hidden></nav>
      <section id="cards" class="cards"></section>
    </div>
    <section id="learn"></section>
    <nav id="pager"></nav>
  </main>
  <footer id="player">
    <div class="dock">
      <span id="tbar"></span>
      <div class="pl-btns">
        <button id="b-reset" type="button" class="icon" title="처음으로 (Home)" aria-label="처음으로"><i data-ic="first"></i></button>
        <button id="b-prev" type="button" title="이전 단계 (←)" aria-label="이전 단계"><i data-ic="prev"></i><span>이전</span></button>
        <button id="b-play" type="button" class="primary" title="자동 재생 / 일시정지 (Space)"></button>
        <button id="b-next" type="button" title="다음 단계 (→)" aria-label="다음 단계"><span>다음</span><i data-ic="next"></i></button>
      </div>
      <div class="pl-track">
        <div class="pl-meta"><span id="count"></span><span id="eta"></span></div>
        <div class="track"><input id="scrub" type="range" min="0" max="0" value="0" aria-label="실행 단계"><div id="marks"></div></div>
      </div>
      <div class="pl-speed">
        <span class="lbl"><i data-ic="gauge"></i>속도</span>
        <div id="speed" class="seg" role="group" aria-label="자동 재생 속도">
          <button type="button" data-v="0.5">느리게</button><button type="button" data-v="1">보통</button><button type="button" data-v="2">빠르게</button><button type="button" data-v="5">훑기</button>
        </div>
        <button id="speed-cycle" type="button" title="속도 바꾸기"><i data-ic="gauge"></i><span></span></button>
      </div>
      <button id="b-keys" type="button" class="icon" popovertarget="keys-pop" title="단축키" aria-label="단축키"><i data-ic="keyboard"></i></button>
    </div>
    <div id="keys-pop" popover>
      <h4>키보드 단축키</h4>
      <dl><dt><kbd>Space</kbd></dt><dd>자동 재생 / 일시정지</dd><dt><kbd>→</kbd></dt><dd>다음 단계</dd><dt><kbd>←</kbd></dt><dd>이전 단계</dd><dt><kbd>Home</kbd></dt><dd>처음으로</dd><dt><kbd>End</kbd></dt><dd>끝으로</dd></dl>
    </div>
  </footer>
</div>
<script src="js/engine.js"></script>
<script src="js/lessons/basic.js"></script>
<script src="js/lessons/basic2.js"></script>
<script src="js/lessons/mid.js"></script>
<script src="js/lessons/mid2.js"></script>
<script src="js/lessons/advanced.js"></script>
<script src="js/lessons/advanced2.js"></script>
<script src="js/lessons/senior.js"></script>
<script src="js/lessons/senior2.js"></script>
<script src="js/lessons/algo.js"></script>
<script src="js/lessons/net.js"></script>
<script src="js/lessons/memory.js"></script>
<script src="js/lessons/ai.js"></script>
<script src="js/lessons/algo2.js"></script>
<script src="js/lessons/ds2.js"></script>
<script src="js/lessons/lang2.js"></script>
<script src="js/lessons/net2.js"></script>
<script src="js/lessons/db2.js"></script>
<script src="js/lessons/memory2.js"></script>
<script src="js/lessons/conc2.js"></script>
<script src="js/lessons/dist2.js"></script>
<script src="js/lessons/ai2.js"></script>
<script src="js/symptoms.js"></script>
<script src="js/prep.js"></script>
<script src="js/drill.js"></script>
<script src="js/app.js"></script>
</body>
</html>
